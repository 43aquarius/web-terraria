  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0;
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function mk(w, h) {
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const x = c.getContext("2d");
    x.imageSmoothingEnabled = false;
    return [c, x];
  }
  function px(x, px_, py, w, h, color) {
    x.fillStyle = color;
    x.fillRect(px_, py, w, h);
  }
  function cloneTex(src) {
    const [c, x] = mk(src.width, src.height);
    x.drawImage(src, 0, 0);
    return c;
  }

    for (let i = 0;i < 14; i++)

    const cx = 2 + r() * 11 | 0, cy = 2 + r() * 11 | 0;

        if (this.explored.length !== world.w * world.h) {
          this.explored = new Uint8Array(world.w * world.h);

    quitToTitle() {

    saveGame() {

    save() {

          world: this.world.encode(),
          p: {

            y: this.player.y,
            hp: this.player.hp,
            maxHp: this.player.maxHp,
            inv: this.player.inv,
            hotbar: this.player.hotbar,
            armor: this.player.armor,
            name: this.playerName
          },
          t: this.timeSec,
          seedStr: this.seedStr,
          chests: Array.from(this.chestContents.entries()),
          explored: rleBits(this.explored),
          devMode: this.devMode,
          smart: this.smart

    toggleInventory() {

    returnCursorToInv() {

        const rest = this.addItem(this.player.cursorItem.id, this.player.cursorItem.count);

          const d = mkDrop(this.player.cursorItem.id, rest, this.player.x, this.player.y - 20);
          this.drops.push(d);
        }
        this.player.cursorItem = null;
      }
    }
    togglePause() {
      if (this.screen !== "playing")
        return;
      this.paused = !this.paused;

      this.uiDirty = true;
    }
    setPaused(v) {
      if (this.screen !== "playing")
        return;
      this.paused = v;

      this.uiDirty = true;
    }
    selectHotbar(i) {
      if (i < 0 || i > 9)
        return;

    }
    toggleMute() {
      SFX.init();
      Music.start();
      const m = SFX.toggleMute();

    }
    toggleMap() {
      if (this.screen !== "playing")
        return;

        this.mouse.right = false;

    toggleSmart() {

    craft(index) {
      if (this.screen !== "playing")
        return;
      const r = RECIPES[index];
      if (!r || !this.canCraft(index))
        return;
      for (const need of r.ins)
        this.removeItems(need.id, need.n);
      const rest = this.addItem(r.out, r.count);
      if (rest > 0)
        this.drops.push(mkDrop(r.out, rest, this.player.x, this.player.y - 20));
      SFX.craft();
      if (r.station === "altar")
        SFX.altar();
      const def = ItemDefs[r.out];
      this.msg(`合成了 ${def.name}${r.count > 1 ? ` ×${r.count}` : ""}`, "#8ee88e");

    clickSlot(i, right) {
      if (this.screen !== "playing")
        return;
      const p = this.player;
      const slot = p.inv[i];
      if (!right && slot && ItemDefs[slot.id]?.kind === "armor") {
        const adef = ItemDefs[slot.id];
        const as = adef.armorSlot;
        if (as) {
          const old = p.armor[as];
          p.armor[as] = slot;
          p.inv[i] = old ?? null;
          SFX.click();
          this.uiDirty = true;
          return;
        }
      }
      this.clickSlotIn(p.inv, i, right);
      SFX.click();
      this.uiDirty = true;
    }
    clickChestSlot(i, right) {
      if (this.screen !== "playing" || this.chestOpen === null)
        return;
      const arr = this.chestContents.get(this.chestOpen);
      if (!arr || i < 0 || i >= arr.length)
        return;
      this.clickSlotIn(arr, i, right);
      SFX.click();
      this.uiDirty = true;
    }
    clickArmorSlot(slot, right) {
      if (this.screen !== "playing")
        return;
      const p = this.player;
      const cur = p.cursorItem;
      const old = p.armor[slot];
      if (!cur) {
        if (old) {
          p.cursorItem = old;
          p.armor[slot] = null;
        }
      } else {
        const def = ItemDefs[cur.id];
        if (def?.kind === "armor" && def.armorSlot === slot) {
          p.armor[slot] = cur;
          p.cursorItem = old;
        }
      }
      SFX.click();
      this.uiDirty = true;
    }
    clickSlotIn(arr, i, right) {
      const p = this.player;
      const slot = arr[i];
      const cur = p.cursorItem;
      if (!right) {
        if (!cur) {
          if (slot) {
            p.cursorItem = slot;
            arr[i] = null;
          }
        } else if (!slot) {
          arr[i] = cur;
          p.cursorItem = null;
        } else if (slot.id === cur.id && ItemDefs[slot.id]) {
          const max = ItemDefs[slot.id].maxStack;
          const move = Math.min(max - slot.count, cur.count);
          slot.count += move;
          cur.count -= move;
          if (cur.count <= 0)
            p.cursorItem = null;
        } else {
          arr[i] = cur;
          p.cursorItem = slot;
        }
      } else {
        if (!cur) {
          if (slot) {
            const half = Math.ceil(slot.count / 2);
            p.cursorItem = { id: slot.id, count: half };
            slot.count -= half;
            if (slot.count <= 0)
              arr[i] = null;
          }
        } else if (!slot) {
          arr[i] = { id: cur.id, count: 1 };
          cur.count--;
          if (cur.count <= 0)
            p.cursorItem = null;
        } else if (slot.id === cur.id && slot.count < ItemDefs[slot.id].maxStack) {
          slot.count++;
          cur.count--;
          if (cur.count <= 0)
            p.cursorItem = null;

    }
    defense() {
      const a = this.player?.armor;
      if (!a)
        return 0;
      let d = 0;
      if (a.head)
        d += ItemDefs[a.head.id]?.defense ?? 0;
      if (a.body)
        d += ItemDefs[a.body.id]?.defense ?? 0;
      if (a.legs)
        d += ItemDefs[a.legs.id]?.defense ?? 0;
      return d;
    }
    addItem(id, n) {
      const p = this.player;
      const max = ItemDefs[id]?.maxStack ?? 999;
      for (let i = 0;i < p.inv.length && n > 0; i++) {
        const s = p.inv[i];
        if (s && s.id === id && s.count < max) {
          const add = Math.min(max - s.count, n);
          s.count += add;
          n -= add;
        }
      }
      for (let i = 0;i < p.inv.length && n > 0; i++) {
        if (!p.inv[i]) {
          const add = Math.min(max, n);
          p.inv[i] = { id, count: add };
          n -= add;
        }
      }
      this.uiDirty = true;
      return n;
    }
    removeItems(id, n) {
      const p = this.player;
      for (let i = p.inv.length - 1;i >= 0 && n > 0; i--) {
        const s = p.inv[i];
        if (s && s.id === id) {
          const take = Math.min(s.count, n);
          s.count -= take;
          n -= take;
          if (s.count <= 0)
            p.inv[i] = null;
        }
      }
      this.uiDirty = true;
    }
    countItem(id) {
      let n = 0;
      for (const s of this.player.inv)
        if (s && s.id === id)
          n += s.count;
      return n;
    }
    canCraft(index) {
      const r = RECIPES[index];
      if (!r)
        return false;
      if (r.station && !this.stations()[r.station])
        return false;
      for (const need of r.ins)
        if (this.countItem(need.id) < need.n)
          return false;
      return true;
    }
    stations() {
      if (this.frame - this.stationFrame < 30)
        return this.stationCache;
      this.stationFrame = this.frame;
      const p = this.player;
      const gx = Math.floor(p.x / 16), gy = Math.floor(p.y / 16);
      const st = { workbench: false, furnace: false, anvil: false, altar: false };
      for (let dy = -3;dy <= 3; dy++) {
        for (let dx = -4;dx <= 4; dx++) {
          const s = TileDefs[this.world.get(gx + dx, gy + dy)].station;
          if (s)
            st[s] = true;
        }
      }
      this.stationCache = st;
      return st;
    }
    msg(text, color = "#e8e4d8") {

      const next = [...ms, { id: this.msgSeq++, text, color, born: Date.now() }];

    }
    loop = (ts) => {
      if (!this.mounted)
        return;

      this.lastTs = ts;
      let steps = 0;
      while (this.acc >= FIXED && steps < 3) {
        this.tick();
        this.acc -= FIXED;
        steps++;
      }
      if (steps === 3)
        this.acc = 0;
      renderGame(this);
    };
    tick() {
      this.frame++;
      if (this.redFlash > 0)
        this.redFlash = Math.max(0, this.redFlash - 0.04);
      if (this.shake > 0) {
        this.shake *= 0.88;
        if (this.shake < 0.15)
          this.shake = 0;
        this.shakeX = (Math.random() * 2 - 1) * this.shake;
        this.shakeY = (Math.random() * 2 - 1) * this.shake;
      } else {
        this.shakeX = 0;
        this.shakeY = 0;
      }
      if (!this.world)
        return;
      if (this.screen === "title") {
        this.titleT++;
        this.tickTitleCam();
        this.world.tickWater(80);
        this.tickParticles();
        this.flushMap();
        return;
      }
      if (this.player.dead) {
        this.tickDead();
        this.flushMap();
        return;
      }

        this.tickGame();
      this.flushMap();
      this.syncUI(false);
    }
    tickTitleCam() {
      const t = this.titleT / 60;
      const span = 260;
      this.camX = this.world.spawnX - this.viewW() / 2 + Math.sin(t * 0.14) * span;

    clampCam() {
      const maxX = this.world.w * 16 - this.viewW();
      const maxY = this.world.h * 16 - this.viewH();
      this.camX = maxX > 0 ? clamp2(this.camX, 0, maxX) : (this.world.w * 16 - this.viewW()) / 2;
      this.camY = maxY > 0 ? clamp2(this.camY, 0, maxY) : 0;

    tickDead() {
      const p = this.player;
      p.deadTimer--;
      this.tickParticles();
      this.dmgs = this.dmgs.filter((d) => --d.life > 0);
      for (const e of this.enemies)
        updateEnemy(this.world, e, p.x, p.y, this.isNight(), this.frame);
      this.enemies = this.enemies.filter((e) => !e.dead && (ENEMY_DEFS[e.kind].boss || Math.hypot(e.x - p.x, e.y - p.y) < 70 * 16));
      if (p.deadTimer <= 0) {
        p.dead = false;
        p.hp = p.maxHp;
        p.breath = PLAYER_CONF.breathMax;
        p.x = this.world.spawnX;
        p.y = this.world.spawnY;
        p.vx = 0;
        p.vy = 0;
        p.iframes = 0;
        p.spawnProt = 600;
        this.enemies = this.enemies.filter((e) => ENEMY_DEFS[e.kind].boss || Math.hypot(e.x - p.x, e.y - p.y) > 20 * 16);
        this.screen = "playing";

    tickGame() {
      const p = this.player;
      this.timeSec += 1 / 60;
      const night = this.isNight();
      if (night !== this.wasNight) {
        Music.setScene(night ? "night" : "day");
        this.wasNight = night;
      }
      if (this.useCooldown > 0)
        this.useCooldown--;
      if (this.placeCooldown > 0)
        this.placeCooldown--;
      if (p.swing) {
        p.swing.t++;
        if (p.swing.t >= p.swing.dur)
          p.swing = null;
      }
      this.devFly = this.devMode && this.keys.has("KeyF");

      if (ev.jumped)

      if (ev.landed) {
        const landVy = prevVy + PLAYER_CONF.gravity;
        if (landVy >= 1.5 && !p.inWater) {
          const n = Math.min(10, 2 + Math.floor(landVy / 1.2));
          burst(this.parts, p.x - 3, p.y, "#b99b76", Math.ceil(n / 2), 1.8, 0.18);
          burst(this.parts, p.x + 3, p.y, "#b99b76", Math.floor(n / 2), 1.8, 0.18);
        }
      }
      if (ev.splash) {
        SFX.splash();

      }
      if (ev.fell > 0) {

        }
      } else if (p.breath < PLAYER_CONF.breathMax) {

      if (this.mouse.right && !this.rightWas && !this.invOpen && !this.mapOpen)

      this.tickEnemies();
      if (this.guide)

      if (this.frame % 60 === 0) {
        this.markExplored(clamp2(Math.floor(p.x / 16), 0, this.world.w - 1), clamp2(Math.floor(p.y / 16), 0, this.world.h - 1));

      }
    }
    tickPlayerFly() {
      const p = this.player;
      const ev = { fell: 0, jumped: false, splash: false, landed: false };
      p.wasInWater = p.inWater;
      p.inWater = bodyInWater(this.world, p);
      p.headWater = tileAt(this.world, p.x, p.y - p.h + 6) === T.WATER;
      const canMove = !this.paused && !this.mapOpen;
      const left = canMove && (this.keys.has("KeyA") || this.keys.has("ArrowLeft"));
      const right = canMove && (this.keys.has("KeyD") || this.keys.has("ArrowRight"));
      const up = canMove && (this.keys.has("KeyW") || this.keys.has("Space") || this.keys.has("ArrowUp"));
      const down = canMove && (this.keys.has("KeyS") || this.keys.has("ArrowDown"));
      const spd = PLAYER_CONF.runSpeed * 1.6;
      if (left && !right) {
        p.vx = Math.max(-spd, p.vx - 0.6);
        p.dir = -1;
      } else if (right && !left) {
        p.vx = Math.min(spd, p.vx + 0.6);
        p.dir = 1;
      } else {
        p.vx *= p.onGround ? 0.55 : 0.92;
        if (Math.abs(p.vx) < 0.04)
          p.vx = 0;
      }
      p.vy = up ? -3 : down ? 3 : 0;
      p.fallStart = null;
      moveBody(this.world, p, { platforms: true, dropThrough: down && !up, stepUp: true });
      if (p.onGround && Math.abs(p.vx) > 0.3)
        p.walkT += 0.16 + Math.abs(p.vx) * 0.06;

        p.walkT = 0;

    followCam() {
      const p = this.player;
      const tx = p.x - this.viewW() / 2;

      this.camX += (tx - this.camX) * 0.14;
      this.camY += (ty - this.camY) * 0.14;
      this.clampCam();

    tickParticles() {
      this.parts = this.parts.filter((pt) => {
        pt.life--;
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += pt.grav;
        return pt.life > 0;
      });
      if (this.parts.length > 400)
        this.parts.splice(0, this.parts.length - 400);
      this.dmgs = this.dmgs.filter((d) => {
        d.life--;
        d.y += d.vy;
        d.vy *= 0.92;
        return d.life > 0;
      });
    }
    tickAmbient() {
      const night = this.isNight();
      if (this.frame % 30 === 0 && this.ambient.length < 6 && Math.random() < 0.16) {
        const x = this.camX + Math.random() * this.viewW();
        const gx = clamp2(Math.floor(x / 16), 0, this.world.w - 1);
        const y = this.world.surface[gx] * 16 - 8 - Math.random() * 32;
        const gy = clamp2(Math.floor(y / 16), 0, this.world.h - 1);
        if (y >= this.camY - 80 && y <= this.camY + this.viewH() + 80 && this.world.get(gx, gy) !== T.WATER) {
          this.ambient.push({
            x,
            y,
            vx: (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.35),
            vy: 0,
            kind: night ? 1 : 0,
            t: 0,
            phase: Math.random() * Math.PI * 2
          });
        }
      }
      const camL = this.camX - 100, camR = this.camX + this.viewW() + 100;
      const camT = this.camY - 100, camB = this.camY + this.viewH() + 100;
      for (let i = this.ambient.length - 1;i >= 0; i--) {
        const b = this.ambient[i];
        b.t++;
        b.phase += b.kind === 0 ? 0.32 : 0.06;
        const gx = clamp2(Math.floor(b.x / 16), 0, this.world.w - 1);
        const baseY = this.world.surface[gx] * 16;
        if (b.kind === 0) {
          b.vx += (Math.random() - 0.5) * 0.1;
          if (Math.random() < 0.006)
            b.vx = (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.45);
          b.vx = clamp2(b.vx, -0.85, 0.85);
          b.x += b.vx;
          b.vy = (baseY - 24 + Math.sin(b.t * 0.07 + b.phase) * 3 - b.y) * 0.03;
          b.y += b.vy;
        } else {
          b.vx += (Math.random() - 0.5) * 0.05;
          b.vy += (Math.random() - 0.5) * 0.05;
          b.vx = clamp2(b.vx, -0.3, 0.3);
          b.vy = clamp2(b.vy, -0.18, 0.18);
          b.x += b.vx;
          b.y += b.vy + (baseY - 20 - b.y) * 0.004;
        }
        if (b.kind === 0 === night && Math.random() < 0.02) {
          this.ambient.splice(i, 1);
          continue;
        }
        if (b.t > 2000 || b.x < camL || b.x > camR || b.y < camT || b.y > camB) {
          this.ambient.splice(i, 1);
        }
      }
    }
    useHeld() {

          if (id === T.TRUNK) {
            const cells = w.fellTree(gx, gy);
            let woods = 0;
            for (const c of cells) {
              if (c.trunk)
                woods++;
              this.mineDamage.delete(w.idx(c.x, c.y));
            }
            for (let k = 0;k < woods; k++) {
              if (Math.random() < 0.6)
                this.drops.push(mkDrop(IT.WOOD, 1, gx * 16 + 8 + (Math.random() - 0.5) * 20, gy * 16 + 4));
            }
            continue;
          }
          if (td.furnitureGroup) {
            const cells = w.clearFurniture(gx, gy);
            for (const c of cells)
              this.mineDamage.delete(w.idx(c.x, c.y));
            if (Math.random() < 0.6 && td.drop)
              this.drops.push(mkDrop(td.drop, 1, gx * 16 + 8, gy * 16 + 8));
            continue;
          }
          w.set(gx, gy, T.AIR);
          this.mineDamage.delete(w.idx(gx, gy));
          if (td.drop && Math.random() < 0.6)
            this.drops.push(mkDrop(td.drop, 1, gx * 16 + 8, gy * 16 + 8));
          broken.push({ x: gx, y: gy, color: td.particleColor });
        }
      }
      for (let i = 0;i < broken.length && i < 14; i++) {
        burst(this.parts, broken[i].x * 16 + 8, broken[i].y * 16 + 8, broken[i].color, 2, 2, 0.2);
      }
      for (const e of this.enemies) {
        if (e.dead)
          continue;
        const d = Math.hypot(e.x - x, e.y - e.h / 2 - y);
        if (d > 80)
          continue;
        const raw = BOMB_DMG * (1 - d / 90);
        const dmg = Math.max(1, Math.round(raw - (ENEMY_DEFS[e.kind].def ?? 0)));
        e.hp -= dmg;
        e.flash = 8;
        e.hpShow = 160;
        e.vx += (e.x >= x ? 1 : -1) * 4 * (1 - e.kb * 0.6);
        e.vy = Math.min(e.vy, -3);
        this.dmgs.push({
          x: e.x + (Math.random() - 0.5) * 8,
          y: e.y - e.h - 6,
          vy: -1.1,
          text: String(dmg),
          color: "#ffb060",
          life: 46,
          crit: false
        });
        if (e.hp <= 0)
          this.killEnemy(e);
      }
      const p = this.player;
      if (!p.dead) {
        const d = Math.hypot(p.x - x, p.y - p.h / 2 - y);
        if (d <= 80) {
          this.hurtPlayer(Math.max(1, Math.round(BOMB_DMG * (1 - d / 90) * 0.5)), p.x >= x ? 1 : -1, true);
        }
      }
      this.shake = 8;
      SFX.explosion();
      burst(this.parts, x, y, "#ff9a3c", 20, 4.2, 0.06);
      burst(this.parts, x, y, "#6a6a6a", 14, 2.4, -0.02);
      burst(this.parts, x, y, "#ffd75e", 8, 3, 0.1);
    }
    hitEnemy(e, dmg, dir, sfx = "melee") {
      const def = ENEMY_DEFS[e.kind];
      const crit = Math.random() < 0.1;
      const raw = dmg * (0.85 + Math.random() * 0.3) * (crit ? 2 : 1);
      const final = Math.max(1, Math.round(raw - (def.def ?? 0)));
      e.hp -= final;
      e.flash = 8;
      e.hpShow = 160;
      e.vx += dir * 3.2 * (1 - e.kb * 0.6);
      e.vy = Math.min(e.vy, -2.4);
      this.dmgs.push({
        x: e.x + (Math.random() - 0.5) * 8,
        y: e.y - e.h - 6,
        vy: -1.1,
        text: String(final),
        color: crit ? "#ffd75e" : "#ffffff",
        life: 46,
        crit
      });
      if (def.boss) {
        this.bossHitTally++;
        if (this.bossHitTally % 6 === 0)
          SFX.bossHit();
      } else if (sfx === "arrow") {

      } else {
        SFX.enemyHit();
      }

    killEnemy(e) {
      e.dead = true;

      burst(this.parts, e.x, e.y - e.h / 2, def.mapColor, 16, 3, 0.2);

        SFX.bossDie();
        this.msg("你击败了克苏鲁之眼！", "#f7d060");
        this.boss = null;
        this.bossPhaseWas = 0;
        this.bossHitTally = 0;
        const ore = 18 + (Math.random() * 13 | 0);
        const lens = 3 + (Math.random() * 3 | 0);
        this.drops.push(mkDrop(IT.DEMONITE_ORE, ore, e.x, e.y - 12));
        this.drops.push(mkDrop(IT.LENS, lens, e.x, e.y - 12));
        this.shake = 10;
        this.uiDirty = true;
        return;
      }
      SFX.enemyDie();
      if (def.gelDrop) {
        const [a, b] = def.gelDrop;
        const n = a + Math.floor(Math.random() * (b - a + 1));
        if (n > 0)
          this.drops.push(mkDrop(IT.GEL, n, e.x, e.y - 8));
      }
      if (e.kind === "zombie" && Math.random() < 0.35) {
        this.drops.push(mkDrop(Math.random() < 0.5 ? IT.TORCH : IT.STONE, 1 + (Math.random() * 2 | 0), e.x, e.y - 8));
      }
      if (def.lensDrop && Math.random() < def.lensDrop) {
        this.drops.push(mkDrop(IT.LENS, 1, e.x, e.y - 8));
      }
    }
    tickEnemies() {
      const p = this.player;
      const night = this.isNight();
      for (const e of this.enemies) {
        updateEnemy(this.world, e, p.x, p.y, night, this.frame);
        const def = ENEMY_DEFS[e.kind];
        if (!night && e.night && !def.boss && Math.random() < 0.012) {
          burst(this.parts, e.x, e.y - e.h / 2, "#6a6a8a", 8, 1.6, -0.02);
          e.dead = true;
          continue;
        }
        if (def.boss && this.boss === e) {

          if (e.mode === "flee" && e.y < this.camY - 300) {
            e.dead = true;

        if (e.kind !== "lslime" && this.frame % 30 === 0 && bodyInLava(this.world, e)) {

            life: 40,
            crit: false
          });
          if (e.hp <= 0) {
            this.killEnemy(e);
            continue;
          }
        }
        if (e.mode === "flee")
          continue;
        if (!p.dead && p.iframes <= 0 && p.spawnProt <= 0) {
          if (Math.abs(e.x - p.x) < e.w / 2 + p.w / 2 && e.y > p.y - p.h - e.h / 2 && e.y - e.h < p.y + e.h / 2) {
            const dmg = Math.max(1, Math.round(e.dmg * (0.9 + Math.random() * 0.2)));
            this.hurtPlayer(dmg, e.x > p.x ? -1 : 1, false);
          }
        }
      }
      if (this.boss && (this.boss.dead || !this.enemies.includes(this.boss)))
        this.boss = null;
      this.enemies = this.enemies.filter((e) => !e.dead && (ENEMY_DEFS[e.kind].boss || Math.hypot(e.x - p.x, e.y - p.y) < 70 * 16));
    }
    hurtPlayer(raw, dir, noKb) {
      const p = this.player;
      if (p.dead || p.iframes > 0)
        return;
      const dmg = Math.max(1, Math.round(raw - this.defense() * 0.5));
      p.hp -= dmg;
      p.lastHurt = this.frame;
      p.iframes = noKb ? 20 : PLAYER_CONF.iframes;
      if (!noKb) {
        p.vx = dir * 3.4;
        p.vy = Math.min(p.vy, -3.2);

      this.redFlash = 1;
      this.shake = Math.min(7, 3 + dmg * 0.15);
      SFX.hurt();
      this.dmgs.push({
        x: p.x,
        y: p.y - p.h - 8,
        vy: -1.2,
        text: String(dmg),
        color: "#ff6060",
        life: 50,
        crit: false
      });
      burst(this.parts, p.x, p.y - p.h / 2, "#c03030", 10, 2.4, 0.2);
      if (p.hp <= 0)
        this.diePlayer();

    diePlayer() {

        this.closeChest();

      Music.setScene("title");
      this.uiDirty = true;

    tickSpawn() {
      this.spawnTimer--;
      if (this.spawnTimer > 0)
        return;
      this.spawnTimer = 80 + Math.random() * 80;
      const w = this.world;
      const p = this.player;
      let count = 0;
      for (const e of this.enemies)
        if (!ENEMY_DEFS[e.kind].boss)
          count++;
      const pgx = clamp2(Math.floor(p.x / 16), 2, w.w - 3);
      const pgy = clamp2(Math.floor(p.y / 16), 2, w.h - 3);
      const dl = w.dirtLine[pgx] ?? w.surface[pgx] + 15;
      const hellY = w.hellY;
      const night = this.isNight();
      const biome = w.biomeAt(pgx);
      let cap;
      let pool;
      let layer;
      if (pgy < dl + 10) {
        layer = "surface";
        if (night) {
          cap = MAX_ENEMIES_NIGHT;
          pool = biome === BIOME.CORRUPTION ? ["zombie", "eye", "eos"] : ["zombie", "eye"];
        } else {
          cap = MAX_ENEMIES_DAY;
          pool = biome === BIOME.JUNGLE ? ["bslime", "bslime", "gslime"] : biome === BIOME.CORRUPTION ? ["eos"] : ["gslime", "bslime"];
        }
      } else if (pgy < hellY) {
        layer = "cave";
        cap = MAX_ENEMIES_CAVE;
        pool = pgy > dl + 40 ? ["bat", "skel"] : ["bat"];
      } else {
        layer = "hell";
        cap = MAX_ENEMIES_HELL;
        pool = ["lslime", "bat"];
      }
      if (count >= cap)
        return;
      const kind = pool[Math.random() * pool.length | 0];
      const def = ENEMY_DEFS[kind];
      const side = Math.random() < 0.5 ? -1 : 1;
      const gx = clamp2(pgx + side * (26 + Math.floor(Math.random() * 14)), 2, w.w - 3);
      const camL = this.camX / 16 - 2, camR = (this.camX + this.viewW()) / 16 + 2;
      if (gx > camL && gx < camR)
        return;
      const x = gx * 16 + 8;
      let y = 0;
      if (layer === "surface") {
        if (def.fly) {
          y = p.y - (12 + Math.random() * 10) * 16;
          if (y < 32)
            return;
        } else {
          const sy = w.surface[gx];
          y = (sy - 1) * 16;
          if (w.get(gx, sy - 1) !== T.AIR || w.get(gx, sy - 2) !== T.AIR)
            return;
        }
      } else {
        const y0 = layer === "cave" ? dl + 10 : hellY;
        const y1 = layer === "cave" ? hellY - 1 : w.h - 3;
        let found = -1;
        for (let tries = 0;tries < 24; tries++) {
          const yy = clamp2(pgy + (Math.random() * 29 | 0) - 14, y0, y1);
          if (w.get(gx, yy) !== T.AIR)
            continue;
          if (w.get(gx, yy - 1) === T.LAVA || w.get(gx, yy + 1) === T.LAVA)
            continue;
          if (def.fly) {
            found = yy;
            break;
          }
          if (w.isSolid(gx, yy + 1)) {
            found = yy;
            break;
          }
        }
        if (found < 0)
          return;
        y = found * 16;
      }
      this.enemies.push(spawnEnemy(kind, x, y));
    }
    devSpawn() {
      const kinds = ["gslime", "bslime", "zombie", "eye", "bat", "skel", "lslime", "eos"];
      const kind = kinds[Math.random() * kinds.length | 0];
      const mw = this.getMouseWorld();
      this.enemies.push(spawnEnemy(kind, mw.x, mw.y));
      this.msg(`[dev] 生成 ${ENEMY_DEFS[kind].name}`, "#8ee8e8");
    }
    devTime() {
      const d = this.dayT();
      const target = d < 0.5 ? 0.7 : 0.3;
      this.timeSec = this.timeSec - this.timeSec % CYCLE + CYCLE * target;
      this.msg(`[dev] 时间跳转至${target === 0.3 ? "正午" : "午夜"}`, "#8ee8e8");
    }
    tickSaplings() {
      for (let i = this.saplings.length - 1;i >= 0; i--) {
        const s = this.saplings[i];
        s.t++;
        if (s.t >= s.due) {
          if (this.growSapling(s.x, s.y))
            this.saplings.splice(i, 1);
          else {
            s.t = 0;
            s.due = SAPLING_MIN + Math.random() * SAPLING_RND;
          }
        }
      }
    }
    growSapling(x, y) {
      if (this.world.get(x, y) !== T.SAPLING)
        return true;
      const below = this.world.get(x, y + 1);
      let leaf = T.LEAF;
      if (below === T.JUNGLE_GRASS)
        leaf = T.LEAF_JUNGLE;
      else if (below === T.CORRUPT_GRASS)
        leaf = T.LEAF_CORRUPT;
      else if (below === T.SNOW)
        leaf = T.LEAF_SNOW;
      else if (below !== T.GRASS)
        return false;
      const h = 5 + (Math.random() * 4 | 0);
      for (let k = 1;k <= h + 1; k++) {
        if (this.world.get(x, y - k) !== T.AIR)
          return false;
      }
      const top = y - h + 1;
      for (let k = 0;k < h; k++)
        this.world.set(x, y - k, T.TRUNK);
      for (let dy = -2;dy <= 0; dy++) {
        const ty = top + dy;
        const half = dy === -2 ? 1 : 2;
        for (let dx = -half;dx <= half; dx++) {
          if (dx === 0 && dy >= -1)
            continue;
          if (this.world.get(x + dx, ty) === T.AIR)
            this.world.set(x + dx, ty, leaf);
        }
      }
      burst(this.parts, x * 16 + 8, top * 16, "#5cb85c", 10, 1.8, 0.1);
      return true;
    }
    tickDrops() {
      const p = this.player;
      for (let i = this.drops.length - 1;i >= 0; i--) {
        const d = this.drops[i];
        updateDrop(this.world, d);
        const noPick = this.noPickup.get(i) ?? 0;
        if (noPick > 0) {
          this.noPickup.set(i, noPick - 1);
          continue;
        }
        const dist = Math.hypot(p.x - d.x, p.y - p.h / 2 - d.y);
        if (dist < 52 && !p.dead) {
          const s = 0.18 + Math.max(0, (52 - dist) / 52) * 0.2;
          d.x += (p.x - d.x) * s;
          d.y += (p.y - p.h / 2 - d.y) * s;
        }
        if (dist < 14 && !p.dead) {
          const rest = this.addItem(d.id, d.count);
          const got = d.count - rest;
          if (got > 0) {
            SFX.pickup();
            this.aggPickup(d.id, got);
          }
          if (rest <= 0) {
            this.drops.splice(i, 1);
            this.noPickup.delete(i);
          } else {
            d.count = rest;
            this.noPickup.set(i, 60);
          }
        } else if (d.age > 60 * 300) {
          this.drops.splice(i, 1);
        }
      }
    }
    aggPickup(id, n) {
      const now = Date.now();
      const cur = this.pickupAgg.get(id);
      if (cur && now < cur.until) {
        cur.count += n;
        const def2 = ItemDefs[id];
        const ms2 = ui.getSnapshot().messages;
        const last = ms2[ms2.length - 1];
        if (last && last.id === (this.pickupAgg.get(id)?.msgId ?? -1)) {
          last.text = `拾取 ${def2.name} ×${cur.count}`;
          ui.set({ messages: [...ms2] });
          return;
        }
      }
      const msgId = this.msgSeq++;
      const def = ItemDefs[id];
      this.pickupAgg.set(id, { id, count: n, until: now + 900, msgId });
      const ms = ui.getSnapshot().messages;
      ui.set({ messages: [...ms, { id: msgId, text: `拾取 ${def.name} ×${n}`, color: "#c8e8ff", born: now }].slice(-8) });
    }
    buildTileColors() {
      this.mmColors = [];
      for (let i = 0;i < 64; i++) {
        const td = TileDefs[i];
        if (!td) {
          this.mmColors.push([0, 0, 0, 0]);
          continue;
        }
        const m = /^#([0-9a-f]{6})$/i.exec(td.mapColor);
        if (m) {
          this.mmColors.push([parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16), 255]);
        } else {
          this.mmColors.push([0, 0, 0, 0]);
        }
      }
    }
    buildMinimap() {
      const c = this.mmCanvas ?? document.createElement("canvas");
      c.width = this.world.w;
      c.height = this.world.h;
      const cx = c.getContext("2d");
      const img = cx.createImageData(this.world.w, this.world.h);
      for (let y = 0;y < this.world.h; y++) {
        for (let x = 0;x < this.world.w; x++) {
          this.paintMMCell(img.data, x, y);
        }
      }
      cx.putImageData(img, 0, 0);
      this.mmCanvas = c;
      this.mmImg = img;
    }
    paintMMCell(data, x, y) {
      const id = this.world.tiles[y * this.world.w + x];
      const p = (y * this.world.w + x) * 4;
      if (id === T.AIR) {
        const wall = this.world.walls[y * this.world.w + x];
        if (wall === 1) {
          data[p] = 52;
          data[p + 1] = 36;
          data[p + 2] = 24;
          data[p + 3] = 255;
        } else if (wall === 2) {
          data[p] = 34;
          data[p + 1] = 34;
          data[p + 2] = 42;
          data[p + 3] = 255;
        } else if (wall > 0) {
          data[p] = 40;
          data[p + 1] = 38;
          data[p + 2] = 40;
          data[p + 3] = 255;
        } else {
          data[p] = 0;
          data[p + 1] = 0;
          data[p + 2] = 0;
          data[p + 3] = 0;
        }
      } else {
        const c = this.mmColors[id] ?? [128, 128, 128, 255];
        data[p] = c[0];
        data[p + 1] = c[1];
        data[p + 2] = c[2];
        data[p + 3] = 255;
      }
    }
    buildMapCanvas() {
      const c = this.mapCanvas ?? document.createElement("canvas");
      c.width = this.world.w;
      c.height = this.world.h;
      const cx = c.getContext("2d");
      const img = cx.createImageData(this.world.w, this.world.h);
      for (let y = 0;y < this.world.h; y++) {
        for (let x = 0;x < this.world.w; x++) {
          this.paintMapCell(img.data, x, y);
        }
      }
      cx.putImageData(img, 0, 0);
      this.mapCanvas = c;
      this.mapImg = img;
      this.mapDirty.clear();
    }
    paintMapCell(data, x, y) {
      const i = y * this.world.w + x;
      const id = this.world.tiles[i];
      const p = i * 4;
      let r = 0, g = 0, b = 0;
      if (id === T.AIR) {
        if (this.world.walls[i] > 0) {
          r = 16;
          g = 14;
          b = 18;
        } else {
          r = 52;
          g = 84;
          b = 138;
        }
      } else {
        const c = this.mmColors[id];
        if (c) {
          r = c[0];
          g = c[1];
          b = c[2];
        } else {
          r = 110;
          g = 110;
          b = 110;
        }
      }
      data[p] = r;
      data[p + 1] = g;
      data[p + 2] = b;
      data[p + 3] = 255;
    }
    onTileChanged = (x, y) => {
      if (this.mmCanvas && this.mmImg) {
        this.paintMMCell(this.mmImg.data, x, y);
        this.mmCanvas.getContext("2d").putImageData(this.mmImg, 0, 0, x, y, 1, 1);
      }
      if (this.mapImg && x >= 0 && y >= 0 && x < this.world.w && y < this.world.h) {
        this.mapDirty.add(y * this.world.w + x);
      }
    };
    flushMap() {
      if (!this.mapCanvas || !this.mapImg || this.mapDirty.size === 0)
        return;
      const w = this.world.w;
      let minX = 1 << 30, minY = 1 << 30, maxX = -1, maxY = -1;
      for (const idx of this.mapDirty) {
        const x = idx % w, y = idx / w | 0;
        if (x < minX)
          minX = x;
        if (x > maxX)
          maxX = x;
        if (y < minY)
          minY = y;
        if (y > maxY)
          maxY = y;
        this.paintMapCell(this.mapImg.data, x, y);
      }
      this.mapDirty.clear();
      this.mapCanvas.getContext("2d").putImageData(this.mapImg, 0, 0, minX, minY, maxX - minX + 1, maxY - minY + 1);
    }
    markExplored(cx, cy) {
      if (!this.explored)
        return;
      const w = this.world.w, h = this.world.h;
      const r = MAP_EXPLORE_R, r2 = r * r;
      for (let dy = -r;dy <= r; dy++) {
        const y = cy + dy;
        if (y < 0 || y >= h)
          continue;
        const span = Math.floor(Math.sqrt(r2 - dy * dy));
        const x0 = Math.max(0, cx - span), x1 = Math.min(w - 1, cx + span);
        this.explored.fill(1, y * w + x0, y * w + x1 + 1);
      }
    }
    syncUI(force) {
      if (!this.uiDirty && !force && this.frame % 12 !== 0)
        return;
      const p = this.player;

  animation:pulse 1.6s ease-in-out infinite}

#paused{background:rgba(0,0,0,.5);z-index:40;padding:16px}
#paused.open{display:flex;align-items:center;justify-content:center;animation:fadein .3s ease-out}
#paused .box{width:288px;max-width:100%;border:2px solid #6a76b8;border-radius:6px;
  background:rgba(16,20,40,.95);padding:20px}
#paused h2{margin-bottom:8px;text-align:center;font-size:18px;font-weight:700;letter-spacing:.2em;
  color:#f7d060;text-shadow:1px 1px 0 #000}
#paused .meta{margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
#paused .who{font-size:11px;line-height:1.6;color:#9ab8e0;text-shadow:1px 1px 0 #000;text-align:center}
#paused .who .mono{font-family:ui-monospace,monospace}
#paused .dev-badge{display:none;border:1px solid rgba(247,208,96,.7);background:rgba(60,48,16,.6);
  padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#f7d060;
  text-shadow:1px 1px 0 #000}
#paused .dev-badge.on{display:inline-block}
#paused .col{display:flex;flex-direction:column;gap:10px}

/* ---- tooltip / 光标物品 ---- */
#tooltip{position:fixed;left:0;top:0;z-index:70;max-width:240px;border:2px solid #6a76b8;
  background:rgba(12,15,32,.94);padding:8px;opacity:0;pointer-events:none;transition:opacity .12s ease-out}
#tooltip .tname{font-size:14px;font-weight:700;color:#f7d060;text-shadow:1px 1px 0 #000}
#tooltip .tkind{font-size:10px;color:#9ab8e0}
#tooltip .tstat{font-size:11px;color:#e8e4d8;line-height:1.5}
#tooltip .tdesc{font-size:11px;line-height:1.4;color:#b8b4a8;max-width:208px}
#tooltip .gap{height:4px}
#cursor-item{position:fixed;left:0;top:0;z-index:70;pointer-events:none}
#cursor-item img{width:32px;height:32px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
#cursor-item .cnt{position:absolute;right:-4px;bottom:-4px;font-size:11px;font-weight:700;
  color:#fff;text-shadow:1px 1px 0 #000}
#cursor-item .cnt.big{font-size:8px}

/* ---- 滚动条 ---- */
.craft-list::-webkit-scrollbar,#inv::-webkit-scrollbar{width:6px}
.craft-list::-webkit-scrollbar-track,#inv::-webkit-scrollbar-track{background:rgba(10,12,26,.8)}
.craft-list::-webkit-scrollbar-thumb,#inv::-webkit-scrollbar-thumb{background:#6a76b8}
.craft-list::-webkit-scrollbar-thumb:hover,#inv::-webkit-scrollbar-thumb:hover{background:#8a96cc}
.craft-list{scrollbar-width:thin;scrollbar-color:#6a76b8 rgba(10,12,26,.8)}
#inv{scrollbar-width:thin;scrollbar-color:#6a76b8 rgba(10,12,26,.8)}

      $("armor-slots").innerHTML = ah;
    }
    const chk = (st.chestOpen ? "1" : "0") + JSON.stringify(st.chestSlots);
    if (chk !== lastChestKey) {
      lastChestKey = chk;
      $("chest-panel").classList.toggle("open", st.chestOpen);
      let ch = "";
      for (let i = 0;i < 20; i++) {
        ch += slotHTML(st.chestSlots[i] ?? null, `data-chest="${i}"`, "gold", "");
      }
      $("chest-grid").innerHTML = ch;
    }
    const bk = st.boss && st.boss.maxHp > 0 ? `${st.boss.name}|${st.boss.hp}|${st.boss.maxHp}` : "";
    if (bk !== lastBossKey) {
      lastBossKey = bk;
      const bar = $("bossbar");
      bar.classList.toggle("open", bk !== "");
      if (bk !== "" && st.boss) {
        $("boss-name").textContent = st.boss.name;
        $("boss-num").textContent = `${st.boss.hp} / ${st.boss.maxHp}`;
        const ratio = Math.max(0, Math.min(1, st.boss.hp / st.boss.maxHp));
        $("boss-fill").style.width = `calc((100% - 4px) * ${ratio})`;
        const track = bar.querySelector(".bar");
        track.setAttribute("aria-label", `${st.boss.name} 生命值`);
        track.setAttribute("aria-valuemax", String(st.boss.maxHp));
        track.setAttribute("aria-valuenow", String(st.boss.hp));
      }
    }
    const smk = String(st.smart);
    if (smk !== lastSmartKey) {
      lastSmartKey = smk;
      const btn = $("smart-btn");
      btn.classList.toggle("on", st.smart);
      btn.setAttribute("aria-pressed", String(st.smart));
      btn.setAttribute("aria-label", st.smart ? "关闭智能光标" : "开启智能光标");
      btn.innerHTML = `${I_CROSSHAIR}<span>智能 ${st.smart ? "开" : "关"}</span>`;
    }
    for (const s of ["workbench", "furnace", "anvil", "altar"]) {
      const el = document.querySelector(`.station[data-st="${s}"]`);
      if (el) {
        el.querySelector(".dot")?.classList.toggle("on", st.stations[s]);
        el.querySelector(".sname")?.classList.toggle("on", st.stations[s]);
      }
    }
    const ck = JSON.stringify(st.craftables);
    if (ck !== lastCraftKey) {
      lastCraftKey = ck;
      const list = st.craftables.filter((c) => c.can && RECIPES[c.index] !== undefined);
      $("craft").innerHTML = list.length === 0 ? `<p class="craft-empty">暂无可合成物品<br>收集材料或靠近工作台试试</p>` : list.map((c) => {
        const r = RECIPES[c.index];
        const url = tex.iconURL[r.out];
        return `<button type="button" class="craft-item" data-craft="${c.index}" data-tip-recipe="${c.index}">
          ${url ? `<img src="${url}" alt="" draggable="false">` : ""}
          <span class="nm">${esc(ItemDefs[r.out]?.name ?? "")}</span>
          ${r.count > 1 ? `<span class="x">×${r.count}</span>` : ""}
        </button>`;
      }).join("");
    }
    const mk2 = st.messages.map((m) => m.id).join(",");
    if (mk2 !== lastMsgKey) {
      lastMsgKey = mk2;
      $("msgs").innerHTML = st.messages.slice(-6).map((m) => `<p class="msg" style="color:${m.color}">${esc(m.text)}</p>`).join("");
    }
    const ik = `${st.biomeName}|${st.depth}|${st.isNight}|${st.muted}`;
    if (ik !== lastInfoKey) {
      lastInfoKey = ik;
      const box = $("infobar");
      box.querySelector(".biome").textContent = st.biomeName;
      box.querySelector(".depth").textContent = st.depth >= 0 ? `${st.depth} 米` : "地表上";
      const dn = box.querySelector(".dn");
      dn.className = `dn ${st.isNight ? "night" : "day"}`;
      dn.innerHTML = `${st.isNight ? I_MOON : I_SUN}<span class="dn-txt">${st.isNight ? "夜晚" : "白天"}</span>`;
      $("btn-mute").innerHTML = st.muted ? I_VOLX : I_VOL;
      $("btn-mute").setAttribute("aria-label", st.muted ? "取消静音" : "静音");
      $("btn-sound").innerHTML = `<span class="row">${st.muted ? I_VOLX : I_VOL}声音：${st.muted ? "关" : "开"}</span>`;
    }
    const pk = `${st.playerName}|${st.seed}|${st.devMode}`;
    if (pk !== lastPausedKey) {
      lastPausedKey = pk;
      $("paused-name").textContent = st.playerName;
      $("paused-seed").textContent = st.seed;
      $("paused-seed-wrap").style.display = st.seed ? "inline" : "none";
      $("paused-dev").classList.toggle("on", st.devMode);
    }
    if (st.playerName !== lastDeadKey) {
      lastDeadKey = st.playerName;
      $("dead-name").textContent = st.playerName;
    }
    const hd = String(st.devMode);
    if (hd !== lastHelpDevKey) {
      lastHelpDevKey = hd;
      for (const id of ["help-modal", "title-help"]) {
        $(id).querySelector(".dev-line")?.classList.toggle("on", st.devMode);
      }
    }
    const ck2 = st.cursorItem ? `${st.cursorItem.id}x${st.cursorItem.count}` : "";
    if (ck2 !== lastCursorKey) {
      lastCursorKey = ck2;
      const ci = $("cursor-item");
      if (st.cursorItem) {
        const url = tex.iconURL[st.cursorItem.id];
        ci.innerHTML = `${url ? `<img src="${url}" alt="" draggable="false">` : ""}${st.cursorItem.count > 1 ? `<span class="cnt${st.cursorItem.count >= 100 ? " big" : ""}">${st.cursorItem.count}</span>` : ""}`;
      } else {
        ci.innerHTML = "";
      }
    }
  }
  var genOpen = false;
  var genSize = "small";
  var generating = false;
  function updateGenSizes() {
    document.querySelectorAll(".size-btn").forEach((b) => {
      const on = b.dataset.size === genSize;
      b.classList.toggle("on", on);
      b.setAttribute("aria-checked", String(on));
    });
  }
  function setGenGenerating(v) {
    generating = v;
    $("btn-gen-start").disabled = v;
    $("btn-gen-start").textContent = v ? "正在生成…" : "开始冒险";
    $("btn-gen-close").disabled = v;
    $("gen-seed").disabled = v;
    $("gen-name").disabled = v;
    $("gen-dev").disabled = v;
    document.querySelectorAll(".size-btn").forEach((b) => {
      b.disabled = v;
    });
    $("gen-spin").classList.toggle("on", v);
  }
  function openGen() {
    genOpen = true;
    updateGenSizes();
    render(ui.getSnapshot());
  }
  function closeGen() {
    if (generating)
      return;
    genOpen = false;
    render(ui.getSnapshot());
  }
  function startGenWorld() {
    if (generating)
      return;
    setGenGenerating(true);
    const seedStr = $("gen-seed").value.trim();
    const name = $("gen-name").value.trim() || "泰拉行者";
    const dev = $("gen-dev").checked;
    window.setTimeout(() => {
      const eng = getEngine();
      if (eng) {
        eng.newWorld(genSize, seedStr, name, dev);
        eng.enterWorld();
      }
      setGenGenerating(false);
      genOpen = false;
      render(ui.getSnapshot());
    }, 60);
  }
  function bindEvents() {
    document.addEventListener("mousedown", (e) => {
      const el = e.target.closest("[data-slot],[data-armor],[data-chest]");
      if (!el)
        return;
      if (e.button !== 0 && e.button !== 2)
        return;
      const eng = getEngine();
      if (!eng)
        return;
      const right = e.button === 2;
      if (el.dataset.armor) {
        eng.clickArmorSlot(el.dataset.armor, right);
      } else if (el.dataset.chest !== undefined) {
        eng.clickChestSlot(Number(el.dataset.chest), right);
      } else {
        const i = Number(el.dataset.slot);
        if (el.dataset.inv === "1")
          eng.clickSlot(i, right);
        else if (e.button === 0)
          eng.selectHotbar(i);
      }
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("click", (e) => {
      const target = e.target;
      const craft2 = target.closest("[data-craft]");
      if (craft2)
        getEngine()?.craft(Number(craft2.dataset.craft));
      const size = target.closest("[data-size]");
      if (size) {
        genSize = size.dataset.size;
        updateGenSizes();
      }
      if (target.closest("[data-close-help]")) {
        helpOpen = false;
        titleHelpOpen = false;
        render(ui.getSnapshot());
      }
    });
    const tip = $("tooltip");
    document.addEventListener("mouseover", (e) => {
      const t = e.target.closest("[data-tip-item],[data-tip-recipe]");
      if (!t) {
        tip.style.opacity = "0";
        return;
      }
      if (t.dataset.tipItem !== undefined)
        tip.innerHTML = itemTipHTML(Number(t.dataset.tipItem));
      else
        tip.innerHTML = recipeTipHTML(Number(t.dataset.tipRecipe));
      tip.style.opacity = "1";
    });
    const place2 = (x, y) => {
      const { offsetWidth: w, offsetHeight: h } = tip;
      let left = x + 16, top = y + 18;
      if (left + w > window.innerWidth - 8)
        left = Math.max(8, x - w - 16);
      if (top + h > window.innerHeight - 8)
        top = Math.max(8, y - h - 18);
      tip.style.transform = `translate(${left}px,${top}px)`;
    };
    document.addEventListener("mousemove", (e) => {
      place2(e.clientX, e.clientY);
      $("cursor-item").style.transform = `translate(${e.clientX + 12}px,${e.clientY + 12}px)`;
    });
    $("btn-mute").addEventListener("click", () => getEngine()?.toggleMute());
    $("btn-help").addEventListener("click", () => {
      helpOpen = !helpOpen;
      render(ui.getSnapshot());
    });
    $("btn-enter").addEventListener("click", () => getEngine()?.enterWorld());
    $("btn-continue").addEventListener("click", () => getEngine()?.continueGame());
    $("btn-regen").addEventListener("click", openGen);
    $("btn-title-help").addEventListener("click", () => {
      titleHelpOpen = true;
      render(ui.getSnapshot());
    });
    $("btn-resume").addEventListener("click", () => getEngine()?.togglePause());
    $("btn-save").addEventListener("click", () => {
      const ok = getEngine()?.saveGame() ?? false;
      getEngine()?.msg(ok ? "已保存：世界与背包已写入本地存档" : "保存失败：请重试", ok ? "#8ee88e" : "#e07070");
    });
    $("btn-sound").addEventListener("click", () => getEngine()?.toggleMute());
    $("btn-quit").addEventListener("click", () => {
      helpOpen = false;
      getEngine()?.quitToTitle();
    });
    $("btn-close-chest").addEventListener("click", () => getEngine()?.closeChest());
    $("btn-gen-start").addEventListener("click", startGenWorld);
    $("btn-gen-back").addEventListener("click", closeGen);
    $("btn-gen-close").addEventListener("click", closeGen);
    window.addEventListener("keydown", (e) => {
      if (e.repeat)
        return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable))
        return;
      const st = ui.getSnapshot();
      if (st.screen !== "playing")
        return;
      const k = e.key.toLowerCase();
      if (k === "e") {
        e.preventDefault();
        getEngine()?.toggleInventory();
      } else if (e.key === "Escape") {
        if (helpOpen) {
          helpOpen = false;
          render(st);
        } else if (st.invOpen || st.chestOpen)
          getEngine()?.toggleInventory();
        else
          getEngine()?.togglePause();
      } else if (k === "m") {
        getEngine()?.toggleMute();
      } else if (k === "h") {
        helpOpen = !helpOpen;
        render(st);
      } else if (/^[0-9]$/.test(k)) {
        if (!st.paused)
          getEngine()?.selectHotbar(k === "0" ? 9 : Number(k) - 1);
      }
    });
  }
  function boot() {
    const style = document.createElement("style");
    style.textContent = CSS;
    document.head.appendChild(style);
    document.body.insertAdjacentHTML("beforeend", BODY_HTML);
    document.body.style.background = "#000";
    tex = getTextures();
    bindEvents();
    const canvas = $("game");
    const eng = new GameEngine(canvas);
    eng.mount();
    ui.subscribe(() => render(ui.getSnapshot()));
    render(ui.getSnapshot());
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
